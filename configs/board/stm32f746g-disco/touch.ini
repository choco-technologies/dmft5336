; STM32F746G-DISCO - capacitive touch panel of the 4.3" LCD (FocalTech
; FT5336 at I2C address 0x38 on I2C3, INT on PI13) - UM1907, ST's BSP
; stm32746g_discovery_ts.c.
;
; The I2C bus itself is dmi2c's board configuration
; (dmi2c: configs/board/stm32f746g-disco/i2c3.ini, node
; /dev/dmi2cx/touch_i2c, driver_order 10/11) - load it too. It is shared
; with the WM8994 audio codec, so it is not duplicated here.
;
; The panel is mounted with its axes swapped relative to the LCD
; (BSP: TS_SWAP_XY) - swap_xy=on gives LCD coordinates, 480x272.
;
; Polled, not interrupt driven: INT (PI13) and the microSD card detect
; (PC13, dmsdio's sdmmc1.ini) both need EXTI line 13, and an STM32 routes
; an EXTI line to one port only. wait_event polls the chip every
; poll_interval_ms instead (an I2C read of one register while nothing
; touches the panel).

[touch]
driver_name=dmft5336
driver_order=12
i2c_bus=/dev/dmi2cx/touch_i2c
address=56
width=480
height=272
swap_xy=on
poll_interval_ms=20
