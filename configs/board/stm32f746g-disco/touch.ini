; STM32F746G-DISCO - capacitive touch panel of the 4.3" LCD (FocalTech
; FT5336 at I2C address 0x38 on I2C3, INT on PI13) - UM1907, ST's BSP
; stm32746g_discovery_ts.c.
;
; Complete configuration: the I2C3 pins, the dmi2c bus and the touch panel.
; They share friends_group=lcd with dmlcdtft's lcd.ini: the panel is the
; input of that display, and dmview finds a display's input among its
; friends. Every driver picks its own friends by friend_role, so the LCD's
; pins and these do not disturb each other. The bus section has
; friend_role=i2c_bus - dmdevfs
; reports its node (/dev/dmi2cx/touch_i2c) to dmft5336 through
; dmdrvi_friend_changed(), no path is configured by hand. Do not load
; dmi2c's own i2c3.ini next to this file: it configures the same controller.
; I2C3 is shared with the WM8994 audio codec - a codec driver would join the
; same bus node.
;
; The panel is mounted with its axes swapped relative to the LCD
; (BSP: TS_SWAP_XY) - swap_xy=on gives LCD coordinates, 480x272.
;
; Polled, not interrupt driven: INT (PI13) and the microSD card detect
; (PC13, dmsdio's sdmmc1.ini) both need EXTI line 13, and an STM32 routes
; an EXTI line to one port only. wait_event polls the chip instead (an I2C
; read of one register while nothing touches the panel): every
; poll_interval_ms while touched and for a second after, else every
; idle_poll_interval_ms.

; I2C3 pins: AF4, open drain - the board has the pull-up resistors.
[touch_i2c_scl]
driver_name=dmgpio
driver_order=10
friends_group=lcd
pin=PH7
mode=alternate
alternate_function=4
speed=maximum
output_circuit=open_drain
pull=none

[touch_i2c_sda]
driver_name=dmgpio
driver_order=10
friends_group=lcd
pin=PH8
mode=alternate
alternate_function=4
speed=maximum
output_circuit=open_drain
pull=none

; The bus: node /dev/dmi2cx/touch_i2c (dmi2c's configuration keys are decimal)
[touch_i2c]
driver_name=dmi2c
driver_order=11
friends_group=lcd
friend_role=i2c_bus
instance=3
role=master
address=56
baudrate=100000
timeout_ms=100

[touch]
driver_name=dmft5336
driver_order=12
friends_group=lcd
address=56
width=480
height=272
swap_xy=on
poll_interval_ms=10
idle_poll_interval_ms=50
